<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003622" />
      <stop offset="50%" stop-color="#134e35" />
      <stop offset="100%" stop-color="#002113" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdea5" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#primaryGrad)" />
  <!-- Subtle Islamic 8-Pointed Star Watermark -->
  <g opacity="0.12" fill="#ffdea5">
    <polygon points="256,40 310,170 450,170 340,260 380,400 256,320 132,400 172,260 62,170 202,170" />
    <circle cx="256" cy="256" r="180" fill="none" stroke="#ffdea5" stroke-width="12" />
  </g>
  <!-- Kaaba & Crescent Emblem -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Kaaba Center Cube -->
    <rect x="-60" y="-50" width="120" height="120" rx="16" fill="#111c2d" stroke="url(#goldGrad)" stroke-width="6" />
    <!-- Golden Kiswah Belt (Hizam) -->
    <rect x="-60" y="-20" width="120" height="20" fill="url(#goldGrad)" />
    <!-- Golden Door (Bab al-Kaaba) -->
    <rect x="0" y="5" width="30" height="65" rx="4" fill="url(#goldGrad)" />
    <!-- Islamic Dome / Arch over Kaaba -->
    <path d="M -80,-65 C -80,-145 80,-145 80,-65" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
    <!-- Small Crescent on Top -->
    <path d="M 0,-155 A 15,15 0 1 1 15,-135 A 11,11 0 1 0 0,-155" fill="url(#goldGrad)" />
  </g>
</svg>
